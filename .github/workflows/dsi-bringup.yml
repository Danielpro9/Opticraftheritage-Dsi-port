name: DSi bring-up build

# Builds src/dsi/DsiBringup.nds with the real BlocksDS toolchain and uploads it
# as a downloadable artifact.
#
# Why this exists: the sandbox this code was developed in has its outbound
# network access restricted by an egress proxy that blocks the BlocksDS/
# Wonderful Toolchain download servers (blocksds.skylyrac.net, codeberg.org,
# wonderful.asie.pl), so nothing there could compile src/dsi/ end-to-end --
# only syntax-check individual files against a generic arm-none-eabi-g++ (see
# the DSi commit history for what that did and did not catch). GitHub-hosted
# runners have no such restriction, so this workflow is the actual build.
#
# Uses the official prebuilt BlocksDS Docker image (skylyrac/blocksds:slim,
# from docs/content/docs/setup/docker.md in the BlocksDS repo) rather than
# bootstrapping the Wonderful Toolchain package manager from scratch, since
# that image ships BLOCKSDS/WONDERFUL_TOOLCHAIN already installed and
# configured.
#
# The built ROM is delivered two ways: as a normal workflow artifact (the
# actions/upload-artifact step), and committed into dist/dsi/ in the repo
# itself. The second one exists because the artifact's download URL is an
# Azure Blob Storage link, which is also blocked by that same sandbox's
# network policy -- dist/dsi/DsiBringup.nds is reachable with a plain git pull
# instead.

on:
  push:
    branches:
      - claude/dsi-port-nvtg0d
    # Mirrors Makefile.game's SOURCEDIRS: ../client ../java ../net ../util
    # ../platform ../external (relative to src/dsi/), plus src/dsi/ itself
    # for the DSi-local dirs that Makefile lists bare (system, lwjgl, java,
    # minecraft, compat). Previously just src/dsi/** and src/platform/**,
    # which silently missed src/net/minecraft/src/**, src/client/**, src/
    # java/**, src/util/** and src/external/** -- most commits touching only
    # those didn't trigger a build at all (a commit editing GuiMainMenu.cpp
    # alone, for example, just sat there with no CI feedback). Caught only
    # because a commit that changed nothing else finally exposed it.
    paths:
      - 'src/dsi/**'
      - 'src/platform/**'
      - 'src/client/**'
      - 'src/java/**'
      - 'src/net/**'
      - 'src/util/**'
      - 'src/external/**'
      - '.github/workflows/dsi-bringup.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  thread-probe:
    # Answered, definitively, the first time this ran: no. The real BlocksDS
    # arm-none-eabi-g++ has no thread backend -- std::mutex/
    # std::condition_variable do not exist in its libstdc++, and std::thread
    # has no constructor able to launch a callable, only its default/move
    # ones. This is why PlatformConfig.h's PLATFORM_ASYNC_FILE_IO exists and
    # why src/dsi/compat/{mutex,thread,condition_variable} shadow the real
    # headers for Makefile.game's build (see that Makefile's INCLUDEDIRS
    # comment). Kept failing (continue-on-error) rather than deleted: it is
    # now a live regression check -- if a future BlocksDS Docker image
    # upgrade ever adds thread support, this job starts passing, which is
    # the signal to revisit the compat shim and PLATFORM_ASYNC_FILE_IO.
    # Does not touch DsiBringup.nds or dist/ at all. The probe lives in
    # src/dsi/probe/, not src/dsi/tools/ (DsiBringup's own SOURCEDIRS), so
    # `make` never picks it up and collides with DsiBringup.cpp's main().
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and link ThreadProbe with the real BlocksDS toolchain
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            skylyrac/blocksds:slim-latest \
            bash -lc '
              set -e
              CXX=/opt/wonderful/toolchain/gcc-arm-none-eabi/bin/arm-none-eabi-g++
              BLOCKSDS=/opt/blocksds/core
              ARCH="-mthumb -mcpu=arm946e-s+nofp"
              SPECS=$BLOCKSDS/sys/crts/dsi_arm9.specs
              mkdir -p /tmp/probe
              $CXX -c src/dsi/probe/ThreadProbe.cpp -o /tmp/probe/ThreadProbe.o \
                $ARCH -DARM9 -D__NDS__ -DDSI_PLATFORM=1 -std=gnu++17 \
                -I$BLOCKSDS/libs/libnds/include -Wall -Wextra
              echo "*** compiled ok, now linking ***"
              $CXX /tmp/probe/ThreadProbe.o -o /tmp/probe/ThreadProbe.elf \
                $ARCH -L$BLOCKSDS/libs/libnds/lib -specs=$SPECS \
                -Wl,--start-group -lnds9 -lstdc++ -lc -Wl,--end-group
              echo "*** linked ok -- std::thread/std::mutex/exceptions are usable on DSi ***"
            '

  game-build:
    # The real game: OptiCraftDsi.nds, built from Makefile.game (the full
    # shared src/client + src/net/minecraft/src + src/java + src/util +
    # src/platform tree -- ~1100 files, see that Makefile's own comment).
    # This is new and unproven, unlike DsiBringup.nds below, so it is its own
    # job: a failure here must never be confused with, or block, the known-
    # good bring-up build. continue-on-error is set because the first few
    # runs of this are expected to surface real compile errors across many
    # files at once -- that is the point of `make -k` (keep going past a
    # failing file instead of stopping at the first one), so one CI round
    # trip surfaces as much as possible instead of one error at a time.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # The full game tree needs external/zlib (RegionFile.cpp/
      # CompressedStreamTools.cpp chunk/NBT compression) and external/stb
      # (src/external/stb_image.cpp). NOT actions/checkout's submodules:true:
      # this repo has two orphaned submodule gitlinks with no .gitmodules
      # entry (`assets`, `external/SDL_net`, both pre-existing, unrelated to
      # this port), which make `git submodule update --init` fail outright
      # ("No url found for submodule path 'assets'") the moment it is asked
      # to init everything. Initialising only the two paths this target
      # actually needs sidesteps both.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init external/zlib and external/stb submodules only
        run: git submodule update --init --depth=1 -- external/zlib external/stb

      - name: Build OptiCraftDsi.nds inside the BlocksDS container
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo/src/dsi \
            skylyrac/blocksds:slim-latest \
            bash -lc "make -f Makefile.game -k VERBOSE=1"

      - name: Upload OptiCraftDsi build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OptiCraftDsi-build
          path: |
            src/dsi/OptiCraftDsi.nds
            src/dsi/build/OptiCraftDsi.map
          if-no-files-found: warn

      # Same reasoning as "build" job's own dist/dsi/DsiBringup.nds commit
      # below: the artifact above downloads through Azure Blob Storage,
      # blocked by the sandbox's network policy this was developed under, so
      # the built ROM also gets committed straight into the repo instead.
      # dist/ is outside this workflow's own paths: filter, so this commit
      # does not re-trigger the build. Runs only when the build step actually
      # produced a .nds (this job is continue-on-error and make -k can exit
      # non-zero with a partial build). Retries the push a few times because
      # this job runs in parallel with "build", which also pushes to
      # dist/dsi/ -- a plain `git push` can lose that race.
      - name: Commit built ROM into dist/dsi/
        if: always()
        run: |
          if [ ! -f src/dsi/OptiCraftDsi.nds ]; then
            echo "No OptiCraftDsi.nds produced; nothing to commit."
            exit 0
          fi
          mkdir -p dist/dsi
          cp src/dsi/OptiCraftDsi.nds dist/dsi/OptiCraftDsi.nds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/dsi/OptiCraftDsi.nds
          if git diff --cached --quiet; then
            echo "Built ROM unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "CI: update built OptiCraftDsi.nds [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), reapplying this build on top of the latest push..."
            git fetch origin "$GITHUB_REF_NAME"
            # NOT `git rebase` here (this used to be a rebase, and it broke
            # the first time two pushes to this branch landed close together
            # in practice: "CONFLICT (content) in dist/dsi/OptiCraftDsi.nds",
            # because git has no way to auto-merge two unrelated binary
            # blobs the way it can text). There is nothing to actually merge
            # for a build artifact like this one -- the ROM this job just
            # built should simply win over whatever was pushed in the
            # meantime.
            #
            # NOT `git reset --soft` either (this used to be `--soft`, and it
            # silently REVERTED unrelated source files the first time a push
            # landed *during* this job's build: `--soft` moves the branch
            # pointer to the new remote tip but leaves the index/working tree
            # exactly as they were, i.e. the source tree from this job's own
            # (now stale) checkout at job start. The next commit below then
            # commits that stale tree on top of the new tip, which *is* a
            # revert of every source file anyone else pushed in the meantime
            # -- exactly what happened to EntityRenderer.cpp/RenderGlobal.cpp/
            # RenderItem.cpp on 2026-09-27. `reset --hard` instead makes the
            # index and working tree fully match the new remote tip -- source
            # files included -- and then only the freshly-copied ROM is
            # re-added and re-committed on top, so nothing else can be carried
            # forward stale.
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp src/dsi/OptiCraftDsi.nds dist/dsi/OptiCraftDsi.nds
            git add dist/dsi/OptiCraftDsi.nds
            if git diff --cached --quiet; then
              echo "Built ROM matches the latest push; nothing to commit."
              exit 0
            fi
            git commit -m "CI: update built OptiCraftDsi.nds [skip ci]"
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push dist/dsi/OptiCraftDsi.nds after retries."
          exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build DsiBringup.nds inside the BlocksDS container
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo/src/dsi \
            skylyrac/blocksds:slim-latest \
            bash -lc "make VERBOSE=1"

      - name: Upload DsiBringup.nds as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DsiBringup-nds
          path: src/dsi/DsiBringup.nds
          if-no-files-found: error

      # The artifact above downloads through Azure Blob Storage, which the
      # development sandbox's network policy blocks -- so the built ROM also
      # gets committed straight into the repo, which a plain `git pull` can
      # reach from there instead. dist/ is outside this workflow's own `paths:`
      # filter, so this commit does not re-trigger the build.
      - name: Commit built ROM into dist/dsi/
        run: |
          mkdir -p dist/dsi
          cp src/dsi/DsiBringup.nds dist/dsi/DsiBringup.nds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/dsi/DsiBringup.nds
          if git diff --cached --quiet; then
            echo "Built ROM unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "CI: update built DsiBringup.nds [skip ci]"
          # Same race game-build's own commit step guards against (two
          # pushes to this branch close together): retry rather than
          # `git rebase`, since there is nothing to merge for a build
          # artifact -- see that step's comment for why a rebase can hit an
          # unresolvable binary conflict here. `reset --hard` (not `--soft`
          # -- see that same comment for the real-incident account of why
          # `--soft` here silently reverted unrelated source files) syncs
          # the index/working tree fully with the new remote tip before the
          # freshly-built ROM is re-copied, re-added and re-committed on top.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), reapplying this build on top of the latest push..."
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            cp src/dsi/DsiBringup.nds dist/dsi/DsiBringup.nds
            git add dist/dsi/DsiBringup.nds
            if git diff --cached --quiet; then
              echo "Built ROM matches the latest push; nothing to commit."
              exit 0
            fi
            git commit -m "CI: update built DsiBringup.nds [skip ci]"
            sleep $((attempt * 2))
          done
          echo "::error::Failed to push dist/dsi/DsiBringup.nds after retries."
          exit 1
